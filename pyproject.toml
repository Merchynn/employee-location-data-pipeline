[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-location-data-pipeline"
version = "1.0.0"
description = "Excel/SharePoint to PostgreSQL pipeline for employee commute analytics and Power BI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "filelock>=3.13,<4",
  "msal>=1.28,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
employee-location-etl = "employee_location_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
